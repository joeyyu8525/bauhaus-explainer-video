<style>

.bub.red { background: #d32a2a; color: #f7f3e6; } .bub.yellow { background: #f2b61b; } .bub.blue { background: #1f4faa; color: #f7f3e6; }

<body>
<div id="wrap"><canvas id="c" width="768" height="960"></canvas><div id="hud"></div></div>
<script type="module">
import { Stage, loadFonts, loadTextures } from './engine.js';
const name = new URLSearchParams(location.search).get('show');
try {
  const mod = await import(name);
  const show = mod.default;
  window.__fonts = await loadFonts(show);
  await loadTextures(show);
  const stage = new Stage(document.getElementById('c'), document.getElementById('hud'), show);
  window.__meta = { fps: show.fps || 22, duration: show.duration };
  window.__show = show;
  window.__render = (t) => stage.renderAt(t);
  window.__check = (t) => stage.check(t);
  stage.renderAt(0);
  window.__ready = true;
} catch (e) {
  window.__error = String(e && e.stack || e);
}
